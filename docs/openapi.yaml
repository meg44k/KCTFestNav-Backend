openapi: 3.0.3
info:
  title: KCTFestNav API
  description: 高専祭ナビゲーションアプリ「KCTFestNav」のバックエンドAPI仕様書
  version: 1.1.0
servers:
  - url: http://localhost:1323
    description: ローカル開発サーバー

paths:
  /auth/login:
    post:
      summary: ログイン
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: ログイン成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWTトークン
        '401':
          description: 認証失敗

  /auth/me:
    get:
      summary: ログイン中のユーザー情報を取得
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: 未認証

  /booths:
    get:
      summary: 全企画・スポットの一覧取得
      tags:
        - Booths
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  booths:
                    type: array
                    items:
                      $ref: '#/components/schemas/Booth'

  /booths/{id}:
    get:
      summary: 個別ブースの詳細取得
      tags:
        - Booths
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booth'

  /stage:
    get:
      summary: ステージイベントの全セクション・ブロック・出演者と演奏中
      description: |
        セクション(sort_order 順) → ブロック(開始時刻順) → 出演者(出演順) の入れ子。
        時刻は +09:00。now_playing は 1 ≦ current_order ≦ 出演者数(学生会が進めた)で、
        今が終了時刻 + 30 分より前のとき true(開始時刻は見ない)。演奏中の出演者は performers の current_order 番目(出演順の番号ではなく並びの位置)。
      tags:
        - Stage
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  sections:
                    type: array
                    items:
                      $ref: '#/components/schemas/StageSection'

  /announcements:
    get:
      summary: 現在のお知らせの取得
      tags:
        - Announcements
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'

  /manage/booths:
    post:
      summary: 企画・スポットの新規作成
      tags:
        - Manage/Booths
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewBooth'
      responses:
        '201':
          description: 作成成功

  /manage/booths/{id}:
    put:
      summary: ブース情報の更新
      tags:
        - Manage/Booths
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBooth'
      responses:
        '200':
          description: 更新成功
    delete:
      summary: ブースの削除
      tags:
        - Manage/Booths
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: 削除成功

  /manage/booths/{id}/congestion:
    patch:
      summary: 混雑度の更新
      description: 企画担当者（自企画のみ）または運営委員のみ実行可能。
      tags:
        - Manage/Booths
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [congestion_status]
              properties:
                congestion_status:
                  $ref: '#/components/schemas/CongestionStatus'
      responses:
        '200':
          description: 更新成功

  /manage/announcements:
    put:
      summary: お知らせの更新
      description: 運営委員のみ実行可能。
      tags:
        - Manage/Announcements
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAnnouncement'
      responses:
        '204':
          description: 更新成功

  /manage/users:
    get:
      summary: ユーザー一覧の取得
      tags:
        - Manage/Users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      summary: 担当者ユーザーの作成
      tags:
        - Manage/Users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
      responses:
        '201':
          description: 作成成功

  /manage/users/{id}:
    get:
      summary: 特定ユーザの取得
      tags:
        - Manage/Users
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    put:
      summary: ユーザー情報の更新
      tags:
        - Manage/Users
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
      responses:
        '200':
          description: 更新成功
    delete:
      summary: ユーザーの削除
      tags:
        - Manage/Users
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 削除成功

  /manage/stage/sections:
    post:
      summary: セクションの追加
      tags:
        - Manage/Stage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageSectionInput'
      responses:
        '201':
          description: 作成成功。作った id を返す
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedID'
        '400':
          description: 入力が不正
        '403':
          description: Admin 以外
        '404':
          description: 存在しない id

  /manage/stage/sections/{id}:
    put:
      summary: セクションの更新
      tags:
        - Manage/Stage
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageSectionInput'
      responses:
        '204':
          description: 成功
        '400':
          description: 入力が不正
        '403':
          description: Admin 以外
        '404':
          description: 存在しない id
    delete:
      summary: セクションの削除(中のブロック・出演者も消える)
      tags:
        - Manage/Stage
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: 成功
        '400':
          description: 入力が不正
        '403':
          description: Admin 以外
        '404':
          description: 存在しない id

  /manage/stage/sections/{id}/blocks:
    post:
      summary: ブロックの追加
      tags:
        - Manage/Stage
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageBlockInput'
      responses:
        '201':
          description: 作成成功。作った id を返す
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedID'
        '400':
          description: 入力が不正
        '403':
          description: Admin 以外
        '404':
          description: 存在しない id

  /manage/stage/blocks/{id}:
    put:
      summary: ブロックの時刻の更新(current_order は保つ)
      tags:
        - Manage/Stage
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageBlockInput'
      responses:
        '204':
          description: 成功
        '400':
          description: 入力が不正
        '403':
          description: Admin 以外
        '404':
          description: 存在しない id
    delete:
      summary: ブロックの削除(中の出演者も消える)
      tags:
        - Manage/Stage
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: 成功
        '400':
          description: 入力が不正
        '403':
          description: Admin 以外
        '404':
          description: 存在しない id

  /manage/stage/blocks/{id}/next:
    post:
      summary: 演奏中を次の出演者へ進める(出演者数 + 1 = 終了で止まる)
      tags:
        - Manage/Stage
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 更新後のブロック
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageBlock'
        '400':
          description: 入力が不正
        '403':
          description: Admin と学生会以外
        '404':
          description: 存在しない id

  /manage/stage/blocks/{id}/prev:
    post:
      summary: 演奏中を 1 つ戻す(0 で止まる)
      tags:
        - Manage/Stage
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 更新後のブロック
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StageBlock'
        '400':
          description: 入力が不正
        '403':
          description: Admin と学生会以外
        '404':
          description: 存在しない id

  /manage/stage/blocks/{id}/performers:
    post:
      summary: 出演者の追加(出演順は最後)
      tags:
        - Manage/Stage
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerformerInput'
      responses:
        '201':
          description: 作成成功。作った id を返す
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedID'
        '400':
          description: 入力が不正
        '403':
          description: Admin 以外
        '404':
          description: 存在しない id

  /manage/stage/performers/{id}:
    put:
      summary: 出演者の更新(出演順は変えない)
      tags:
        - Manage/Stage
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerformerInput'
      responses:
        '204':
          description: 成功
        '400':
          description: 入力が不正
        '403':
          description: Admin 以外
        '404':
          description: 存在しない id
    delete:
      summary: 出演者の削除
      tags:
        - Manage/Stage
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: 成功
        '400':
          description: 入力が不正
        '403':
          description: Admin 以外
        '404':
          description: 存在しない id

  /manage/stage/performers/{id}/move:
    post:
      summary: 出演順を隣と入れ替える(端なら何もしない)
      tags:
        - Manage/Stage
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveInput'
      responses:
        '204':
          description: 成功
        '400':
          description: 入力が不正
        '403':
          description: Admin 以外
        '404':
          description: 存在しない id

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        assignedSpotId:
          type: string
          nullable: true
          description: 企画担当者の場合、担当している企画ID

    NewUser:
      type: object
      required: [username, password, role]
      properties:
        username:
          type: string
        password:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        assignedSpotId:
          type: string
          nullable: true

    UserRole:
      type: string
      enum: [admin, staff]
      description: admin=運営委員, staff=企画担当者

    Booth:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          description: ブース名
        organizer:
          type: string
          description: 主催者(ex. 1-1, 陸上部)
        detail:
          type: string
          description: ブースの説明
        location:
          type: string
          description: 場所の説明(ex. 第一体育館)
        image_url:
          type: string
          description: 紹介画像のURL。未設定の場合は空文字
        congestion_status:
          $ref: '#/components/schemas/CongestionStatus'
        congestion_updated_at:
          type: string
          format: date-time
          nullable: true
          description: 混雑度を最後に更新した時刻。まだ一度も更新していなければ null
        x:
          type: number
          description: 館内マップ上のX座標
        y:
          type: number
          description: 館内マップ上のY座標
        z:
          type: number
          description: 館内マップ上のZ座標(階数)
        latitude:
          type: number
          description: 緯度。未設定の場合は0
        longitude:
          type: number
          description: 経度。未設定の場合は0

    NewBooth:
      type: object
      required: [name]
      properties:
        name:
          type: string
        organizer:
          type: string
        detail:
          type: string
        location:
          type: string
        image_url:
          type: string
        x:
          type: number
        y:
          type: number
        z:
          type: number
        latitude:
          type: number
        longitude:
          type: number

    UpdateBooth:
      type: object
      required: [name]
      properties:
        name:
          type: string
        organizer:
          type: string
        detail:
          type: string
        location:
          type: string
        image_url:
          type: string
        congestion_status:
          $ref: '#/components/schemas/CongestionStatus'
        x:
          type: number
        y:
          type: number
        z:
          type: number
        latitude:
          type: number
        longitude:
          type: number

    CongestionStatus:
      type: integer
      enum: [0, 1, 2]
      description: 0=空いている, 1=少し混雑, 2=かなり混雑

    StageSection:
      type: object
      properties:
        id: {type: integer}
        name: {type: string, example: Live1}
        location: {type: string, example: 第一体育館}
        sort_order: {type: integer}
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/StageBlock'
    StageBlock:
      type: object
      properties:
        id: {type: integer}
        section_id: {type: integer}
        start_time: {type: string, format: date-time, example: '2026-10-31T13:00:00+09:00'}
        end_time: {type: string, format: date-time}
        current_order:
          type: integer
          description: 0 = まだ始まっていない、1〜出演者数 = その順番が演奏中、出演者数 + 1 = 終了
        now_playing: {type: boolean}
        performers:
          type: array
          items:
            $ref: '#/components/schemas/Performer'
    Performer:
      type: object
      properties:
        id: {type: integer}
        block_id: {type: integer}
        name: {type: string}
        detail: {type: string}
        thumbnail_url: {type: string}
        perform_order: {type: integer}
    StageSectionInput:
      type: object
      required: [name]
      properties:
        name: {type: string}
        location: {type: string}
        sort_order: {type: integer}
    StageBlockInput:
      type: object
      required: [start_time, end_time]
      properties:
        start_time: {type: string, format: date-time}
        end_time: {type: string, format: date-time}
    PerformerInput:
      type: object
      required: [name]
      properties:
        name: {type: string}
        detail: {type: string}
        thumbnail_url: {type: string}
    MoveInput:
      type: object
      properties:
        direction: {type: string, enum: [up, down]}
    CreatedID:
      type: object
      properties:
        id: {type: integer}
    Announcement:
      type: object
      properties:
        content:
          type: string

    NewAnnouncement:
      type: object
      required: [content]
      properties:
        content:
          type: string
